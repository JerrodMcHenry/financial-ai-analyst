[project]
name = "financial-analyst"
version = "0.1.0"
description = "Enterprise Financial AI Analyst: SEC filings research copilot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
# Local semantic retrieval (D-029). Exact pins: FastEmbed cannot pin a model revision, so the
# model is installed separately and verified by hash. onnxruntime 1.23.2 is the newest release
# with Intel macOS wheels for Python 3.13; FastEmbed requires a newer one on Python 3.14.
semantic = [
    "fastembed==0.9.1",
    "onnxruntime==1.23.2; python_full_version < '3.14'",
    "onnxruntime>=1.24.2; python_full_version >= '3.14'",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.9,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
